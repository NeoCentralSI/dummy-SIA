name: Deploy Dummy SIA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neocentral-dev-dummy-sia
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check src/index.js
      - name: Verify health endpoint
        env:
          PORT: 4000
          API_TOKEN: ci-dummy-sia-token
        run: |
          node src/index.js > /tmp/dummy-sia.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dummy-sia.log
          exit 1

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: neocentral-dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER" && test -n "$DEPLOY_DIR"
          rsync -az --delete             --exclude='.env'             --exclude='.git/'             --exclude='.deployed-sha'             --exclude='node_modules/'             -e "ssh -p $DEPLOY_PORT"             ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Build, deploy, and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"             "DEPLOY_DIR='$DEPLOY_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose up -d --build dummy-sia
          for attempt in $(seq 1 30); do
            if docker compose exec -T dummy-sia               wget -qO- http://127.0.0.1:4000/health >/dev/null; then
              printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=150 dummy-sia
          exit 1
          REMOTE
