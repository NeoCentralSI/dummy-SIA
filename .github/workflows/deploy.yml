name: Deploy Dummy SIA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to deploy (empty = the selected branch)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: staging-dummy-sia
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check src/index.js
      - name: Health endpoint answers
        env:
          PORT: 4000
          API_TOKEN: ci-dummy-sia-token
        run: |
          node src/index.js > /tmp/dummy-sia.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            curl --fail --silent http://127.0.0.1:4000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dummy-sia.log
          exit 1

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            test -n "${!name}" || { echo "::error::$name is empty"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config

      - name: Pull, build, and start on the server
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          test -n "$DEPLOY_DIR" || { echo "::error::variable DEPLOY_DIR is empty"; exit 1; }
          ssh vps "DEPLOY_DIR='$DEPLOY_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch --quiet origin "$DEPLOY_SHA"
          git checkout --quiet -f -B main "$DEPLOY_SHA"
          docker compose up -d --build dummy-sia
          for attempt in $(seq 1 30); do
            if docker compose exec -T dummy-sia wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1; then
              printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
              docker image prune -f >/dev/null
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=150 dummy-sia
          exit 1
          REMOTE
