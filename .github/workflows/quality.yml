name: Dummy SIA Quality Gate

on:
  pull_request:
  push:
    branches: [develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dummy-sia-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check src/index.js
      - name: Verify health endpoint
        env:
          PORT: 4000
          API_TOKEN: ci-dummy-sia-token
        run: |
          node src/index.js > /tmp/dummy-sia.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dummy-sia.log
          exit 1
