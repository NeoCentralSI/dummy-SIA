# dummy-SIA on its own: no shared network with the backend.
# The backend reaches it through a published port, like it would reach a real SIA.
#   docker compose up -d --build
# From the backend container on the same machine: SIA_BASE_URL=http://host.docker.internal:4000
# Every request needs the API_TOKEN from .env. Docker-published ports bypass UFW;
# to keep the port off the internet, set DUMMY_SIA_BIND to the docker0 address
# (usually 172.17.0.1). 127.0.0.1 would not be reachable from other containers.

services:
  dummy-sia:
    build: .
    image: ${DUMMY_SIA_IMAGE:-neocentral-dummy-sia}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
    ports:
      - "${DUMMY_SIA_BIND:-0.0.0.0}:${DUMMY_SIA_PORT:-4000}:4000"
