services:
  dummy-sia:
    build:
      context: .
    image: ${DUMMY_SIA_IMAGE:-neocentral-dummy-sia}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
    expose:
      - "4000"
    networks:
      - neocentral
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  neocentral:
    external: true
    name: ${SHARED_NETWORK_NAME:-neocentral}
